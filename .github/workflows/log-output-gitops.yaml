name: Release Log Output

on:
  push:
    branches:
      - main
    paths:
      - 'applications/log-output/**'

permissions:
  contents: write

jobs:
  build-publish-release:
    name: Build, Push and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Log Output
        run: |
          docker build \
            --tag "reyver/log-output:$GITHUB_SHA" \
            applications/log-output

          docker push "reyver/log-output:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image
        working-directory: applications/log-output
        run: |
          kustomize edit set image \
            reyver/log-output=reyver/log-output:$GITHUB_SHA

      - name: Commit new image version
        uses: EndBug/add-and-commit@v10
        with:
          add: 'applications/log-output/kustomization.yaml'
          message: 'Release Log Output ${{ github.sha }}'
