name: Release Todo application

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-images
  FRONTEND_IMAGE: todo-app
  BACKEND_IMAGE: todo-backend

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest

    environment: GKE_PROJECT

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Verify authentication
        run: |
          gcloud auth list
          gcloud config get-value project

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGISTRY}" --quiet

      - name: Build frontend image
        run: |
          docker build \
            --platform linux/amd64 \
            -t "${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${FRONTEND_IMAGE}:${GITHUB_SHA}" \
            applications/project

      - name: Push frontend image
        run: |
          docker push \
            "${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${FRONTEND_IMAGE}:${GITHUB_SHA}"

      - name: Build backend image
        run: |
          docker build \
            --platform linux/amd64 \
            -t "${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${BACKEND_IMAGE}:${GITHUB_SHA}" \
            applications/todo-backend

      - name: Push backend image
        run: |
          docker push \
            "${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${BACKEND_IMAGE}:${GITHUB_SHA}"

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${GKE_CLUSTER}" \
            --zone "${GKE_ZONE}" \
            --project "${PROJECT_ID}"

      - name: Select deployment images
        run: |
          sed -i \
            "s|newName: reyver/todo-app|newName: ${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${FRONTEND_IMAGE}|" \
            kustomization.yaml

          sed -i \
            "s|newTag: 3.5-amd64|newTag: ${GITHUB_SHA}|" \
            kustomization.yaml

          sed -i \
            "s|newName: reyver/todo-backend|newName: ${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${BACKEND_IMAGE}|" \
            kustomization.yaml

      - name: Preview Kubernetes resources
        run: |
          kubectl kustomize .

      - name: Deploy to GKE
        run: |
          kubectl apply -k .

      - name: Verify deployments
        run: |
          kubectl rollout status deployment/todo-app \
            --namespace project \
            --timeout=180s

          kubectl rollout status deployment/todo-backend \
            --namespace project \
            --timeout=180s
