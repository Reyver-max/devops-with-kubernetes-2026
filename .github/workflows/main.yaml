name: Release Todo application

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-images
  FRONTEND_IMAGE: todo-app
  BACKEND_IMAGE: todo-backend

jobs:
  build-publish-release:
    name: Build, Push and Release
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud --quiet auth configure-docker "$REGISTRY"

      - name: Form image names
        run: |
          echo "FRONTEND_IMAGE_TAG=${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${FRONTEND_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE_TAG=${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${BACKEND_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build frontend image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "$FRONTEND_IMAGE_TAG" \
            applications/project

      - name: Build backend image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "$BACKEND_IMAGE_TAG" \
            applications/todo-backend

      - name: Publish frontend image
        run: docker push "$FRONTEND_IMAGE_TAG"

      - name: Publish backend image
        run: docker push "$BACKEND_IMAGE_TAG"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image versions
        run: |
          kustomize edit set image PROJECT/TODO_APP="$FRONTEND_IMAGE_TAG"
          kustomize edit set image PROJECT/TODO_BACKEND="$BACKEND_IMAGE_TAG"

      - name: Commit new image versions
        uses: EndBug/add-and-commit@v10
        with:
          add: 'kustomization.yaml'
          message: 'Release Todo application ${{ github.sha }}'
