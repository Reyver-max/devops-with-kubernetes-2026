name: Release Todo application

on:
  push:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}

  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b

  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-images

  FRONTEND_IMAGE: todo-app
  BACKEND_IMAGE: todo-backend

  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest

    environment: GKE_PROJECT

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud --quiet auth configure-docker "$REGISTRY"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.GKE_ZONE }}

      - name: Select deployment namespace
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "NAMESPACE=project" >> "$GITHUB_ENV"
          else
            echo "NAMESPACE=$BRANCH" >> "$GITHUB_ENV"
          fi

      - name: Form image names
        run: |
          echo "FRONTEND_IMAGE_TAG=${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${FRONTEND_IMAGE}:${BRANCH}-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE_TAG=${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${BACKEND_IMAGE}:${BRANCH}-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build frontend image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "$FRONTEND_IMAGE_TAG" \
            applications/project

      - name: Build backend image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "$BACKEND_IMAGE_TAG" \
            applications/todo-backend

      - name: Publish frontend image
        run: |
          docker push "$FRONTEND_IMAGE_TAG"

      - name: Publish backend image
        run: |
          docker push "$BACKEND_IMAGE_TAG"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        run: |
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl config set-context \
            --current \
            --namespace="$NAMESPACE"

          kustomize edit set namespace "$NAMESPACE"

          kustomize edit set image \
            PROJECT/TODO_APP="$FRONTEND_IMAGE_TAG"

          kustomize edit set image \
            PROJECT/TODO_BACKEND="$BACKEND_IMAGE_TAG"

          echo "Deploying branch '$BRANCH' into namespace '$NAMESPACE'"

          echo "Generated Kubernetes manifests:"
          kustomize build .

          kustomize build . | kubectl apply -f -

          kubectl rollout status deployment/todo-app \
            --namespace "$NAMESPACE" \
            --timeout=180s

          kubectl rollout status deployment/todo-backend \
            --namespace "$NAMESPACE" \
            --timeout=180s

          kubectl get pods \
            --namespace "$NAMESPACE"

          kubectl get services \
            --namespace "$NAMESPACE" \
            -o wide
