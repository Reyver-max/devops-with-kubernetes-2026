apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  namespace: exercises
  name: ping-pong

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ping-pong

  strategy:
    canary:
      steps:
        - setWeight: 50

        - analysis:
            templates:
              - templateName: ping-pong-cpu

  template:
    metadata:
      labels:
        app: ping-pong

    spec:
      containers:
        - name: ping-pong
          image: reyver/ping-pong:4.1
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 1

          env:
            - name: PORT
              value: "3000"

            - name: POSTGRES_HOST
              value: postgres-svc

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: postgres

            - name: POSTGRES_DB
              value: pingpong
