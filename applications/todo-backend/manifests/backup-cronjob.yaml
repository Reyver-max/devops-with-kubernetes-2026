apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-database-backup
  namespace: project
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: europe-north1-docker.pkg.dev/devops-course-503807/dwk-images/todo-backup:3.10-amd64
              imagePullPolicy: Always
              env:
                - name: PGHOST
                  value: todo-postgres-svc
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  value: postgres
                - name: PGDATABASE
                  value: todos
                - name: BUCKET_NAME
                  value: reyver-todo-backups-devops-course-503807
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /var/secrets/google/key.json
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -eu

                  TIMESTAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
                  BACKUP_FILE="/tmp/todo-backup-${TIMESTAMP}.sql"

                  echo "Creating PostgreSQL backup..."
                  pg_dump --format=plain --file="${BACKUP_FILE}"

                  echo "Authenticating to Google Cloud..."
                  gcloud auth activate-service-account                     --key-file="${GOOGLE_APPLICATION_CREDENTIALS}"

                  echo "Uploading backup to gs://${BUCKET_NAME}/..."
                  gcloud storage cp                     "${BACKUP_FILE}"                     "gs://${BUCKET_NAME}/todo-backup-${TIMESTAMP}.sql"

                  echo "Backup uploaded successfully."
              volumeMounts:
                - name: storage-key
                  mountPath: /var/secrets/google
                  readOnly: true
          volumes:
            - name: storage-key
              secret:
                secretName: storage-sa-key
