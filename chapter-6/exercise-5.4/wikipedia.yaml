
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikipedia
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wikipedia
  template:
    metadata:
      labels:
        app: wikipedia
    spec:
      volumes:
        - name: wikipedia-content
          emptyDir: {}

      initContainers:
        - name: download-kubernetes
          image: curlimages/curl:8.12.1
          command:
            - sh
            - -c
            - |
              curl -fLsS --retry 3 \
                https://en.wikipedia.org/wiki/Kubernetes \
                -o /usr/share/nginx/html/index.html
          volumeMounts:
            - name: wikipedia-content
              mountPath: /usr/share/nginx/html

        - name: random-wikipedia-sidecar
          image: curlimages/curl:8.12.1
          restartPolicy: Always
          command:
            - sh
            - -c
            - |
              while true; do
                DELAY=$((300 + $(od -An -N4 -tu4 /dev/urandom) % 601))
                echo "Waiting ${DELAY} seconds"
                sleep "$DELAY"
                curl -fLsS --retry 3 \
                  https://en.wikipedia.org/wiki/Special:Random \
                  -o /usr/share/nginx/html/random.html.tmp &&
                mv /usr/share/nginx/html/random.html.tmp \
                   /usr/share/nginx/html/random.html
              done
          volumeMounts:
            - name: wikipedia-content
              mountPath: /usr/share/nginx/html

      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: wikipedia-content
              mountPath: /usr/share/nginx/html
---
apiVersion: v1
kind: Service
metadata:
  name: wikipedia-svc
  namespace: default
spec:
  selector:
    app: wikipedia
  ports:
    - port: 80
      targetPort: 80

